name: Playwright

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      project:
        description: 'Playwright project to run'
        type: choice
        default: all
        options:
          - all
          - chromium
          - firefox
          - webkit
          - mobile-chrome
          - mobile-safari
          - api
          - perf
      grep:
        description: 'Tag/title filter passed to --grep (e.g. @smoke, @regression). Empty = everything.'
        type: string
        default: ''
      workers:
        description: 'Parallel workers per job (integer or percentage). Empty = Playwright default.'
        type: string
        default: ''

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BASE_URL: ${{ vars.BASE_URL }}
  API_URL: ${{ vars.API_URL }}
  WORKERS: ${{ inputs.workers }}

jobs:
  quality:
    name: Lint & type-check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check

  plan:
    name: Plan test matrix
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.plan.outputs.projects }}
      grep: ${{ steps.plan.outputs.grep }}
    steps:
      - id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          INPUT_PROJECT: ${{ inputs.project }}
          INPUT_GREP: ${{ inputs.grep }}
        run: |
          all='["chromium","firefox","webkit","mobile-chrome","mobile-safari","api","perf"]'
          case "$EVENT" in
            workflow_dispatch)
              if [ "$INPUT_PROJECT" = "all" ]; then projects="$all"; else projects="[\"$INPUT_PROJECT\"]"; fi
              grep="$INPUT_GREP" ;;
            *)
              projects='["chromium","firefox","webkit","api"]'; grep='@smoke' ;;
          esac
          echo "projects=$projects" >> "$GITHUB_OUTPUT"
          echo "grep=$grep" >> "$GITHUB_OUTPUT"
          echo "Projects: $projects | grep: '${grep}'"

  test:
    name: Test (${{ matrix.project }})
    needs: [quality, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.plan.outputs.projects) }}
    env:
      BLOB_REPORT_NAME: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Resolve browser
        id: browser
        shell: bash
        run: |
          case "${{ matrix.project }}" in
            chromium|mobile-chrome|perf) echo "name=chromium" >> "$GITHUB_OUTPUT" ;;
            firefox) echo "name=firefox" >> "$GITHUB_OUTPUT" ;;
            webkit|mobile-safari) echo "name=webkit" >> "$GITHUB_OUTPUT" ;;
            *) echo "name=" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: steps.browser.outputs.name != ''
        id: cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.browser.outputs.version }}-${{ steps.browser.outputs.name }}

      - name: Install browser and system dependencies
        if: steps.browser.outputs.name != '' && steps.cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ steps.browser.outputs.name }}

      - name: Install system dependencies only
        if: steps.browser.outputs.name != '' && steps.cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ steps.browser.outputs.name }}

      - name: Run tests
        shell: bash
        # Secrets are scoped to this step so no other step (e.g. npm ci install scripts) sees them.
        env:
          GREP: ${{ needs.plan.outputs.grep }}
          DEMOBLAZE_USERNAME: ${{ secrets.DEMOBLAZE_USERNAME }}
          DEMOBLAZE_PASSWORD: ${{ secrets.DEMOBLAZE_PASSWORD }}
        run: |
          args=(--project="${{ matrix.project }}" --pass-with-no-tests)
          if [ -n "$GREP" ]; then args+=(--grep "$GREP"); fi
          npx playwright test "${args[@]}"

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.project }}
          path: blob-report
          retention-days: 7

      - name: Upload JUnit results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.project }}
          path: test-results/junit.xml
          retention-days: 14

      - name: Upload failure artifacts (traces, screenshots, videos)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts-${{ matrix.project }}
          path: test-results/artifacts
          retention-days: 7

  report:
    name: Merge reports
    needs: [test]
    if: ${{ !cancelled() && needs.test.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into HTML and JUnit
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: merged-junit.xml
        run: npx playwright merge-reports --reporter html,junit ./all-blob-reports

      - uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            merged-junit.xml
          retention-days: 14
